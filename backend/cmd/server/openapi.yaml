openapi: 3.0.3
info:
  title: Attic Asset Management API
  description: API for managing organizational assets, warranties, and attachments
  version: 1.0.0
  contact:
    name: Attic
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication endpoints
  - name: Categories
    description: Asset category management
  - name: Locations
    description: Location management
  - name: Conditions
    description: Asset condition management
  - name: Assets
    description: Asset management
  - name: Tags
    description: Shared asset tag management
  - name: Asset Events
    description: User-managed asset history events
  - name: Warranties
    description: Warranty management
  - name: Attachments
    description: File attachment management

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

  /api/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories:
    get:
      tags: [Categories]
      summary: List categories
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create category
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /api/categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by ID
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
        - name: inherited
          in: query
          description: Include the effective attribute schema inherited from ancestor categories
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Update category
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags: [Categories]
      summary: Delete category
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Category deleted

  /api/locations:
    get:
      tags: [Locations]
      summary: List locations
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '200':
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
    post:
      tags: [Locations]
      summary: Create location
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'

  /api/locations/{id}:
    get:
      tags: [Locations]
      summary: Get location by ID
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Location details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
    put:
      tags: [Locations]
      summary: Update location
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '200':
          description: Location updated
    delete:
      tags: [Locations]
      summary: Delete location
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Location deleted

  /api/conditions:
    get:
      tags: [Conditions]
      summary: List conditions
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '200':
          description: List of conditions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Condition'
    post:
      tags: [Conditions]
      summary: Create condition
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionInput'
      responses:
        '201':
          description: Condition created

  /api/conditions/{id}:
    get:
      tags: [Conditions]
      summary: Get condition by ID
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Condition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Condition'
    put:
      tags: [Conditions]
      summary: Update condition
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionInput'
      responses:
        '200':
          description: Condition updated
    delete:
      tags: [Conditions]
      summary: Delete condition
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Condition deleted

  /api/collections:
    get:
      tags: [Collections]
      summary: List shared collections
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
        '400':
          description: Invalid request
        '404':
          description: Collection not found in this workspace
    post:
      tags: [Collections]
      summary: Create collection
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Invalid request
        '404':
          description: Collection not found in this workspace
        '409':
          description: A collection with this name already exists (case insensitive)

  /api/collections/{id}:
    get:
      tags: [Collections]
      summary: Get collection
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Invalid request
        '404':
          description: Collection not found in this workspace
    put:
      tags: [Collections]
      summary: Update collection
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Invalid request
        '404':
          description: Collection not found in this workspace
        '409':
          description: A collection with this name already exists (case insensitive)
    delete:
      tags: [Collections]
      summary: Delete collection without deleting assets
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '404':
          description: Collection not found in this workspace

  /api/tags:
    get:
      tags: [Tags]
      summary: List shared tags with active asset counts
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Tag' } }
    post:
      tags: [Tags]
      summary: Create a shared tag
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { description: A tag with this name already exists, case-insensitively }

  /api/tags/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Tags]
      summary: Get a shared tag
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '404': { description: Tag not found in this workspace }
    put:
      tags: [Tags]
      summary: Rename or describe a shared tag
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { description: A tag with this name already exists, case-insensitively }
    delete:
      tags: [Tags]
      summary: Delete a tag and detach it from assets
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Deleted without deleting assets }
        '404': { description: Tag not found in this workspace }

  /api/assets:
    get:
      tags: [Assets]
      summary: List assets
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
        - name: collection_id
          in: query
          description: Filter by a shared collection, combined with other filters
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: query
          description: Repeat to filter by multiple shared tag UUIDs.
          schema: { type: array, maxItems: 50, items: { type: string, format: uuid } }
          style: form
          explode: true
        - name: tag_match
          in: query
          description: Match any selected tag by default, or require all selected tags.
          schema: { type: string, enum: [any, all], default: any }
        - name: attribute_q
          in: query
          description: Case-insensitive literal substring across active visible attribute values and select option labels. Combined with other criteria using AND; percent, underscore and backslash are literal.
          schema:
            type: string
            maxLength: 1000
        - name: category_id
          in: query
          description: Filter by a category UUID (including its descendants) or use `uncategorized` for assets without a category
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                enum: [uncategorized]
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: condition_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
    post:
      tags: [Assets]
      summary: Create asset
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

  /api/assets/search:
    post:
      tags: [Assets]
      summary: Search assets using structured criteria
      description: Read-only search. Criteria are validated against current workspace references and enabled features before filtering and pagination. Maximum request body is 64 KiB; unknown properties and trailing JSON are rejected.
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetSearchRequest'
      responses:
        '200':
          description: Matching assets with total before pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
        '400':
          description: Invalid request or unavailable rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterError'
        '401':
          description: Authentication required

  /api/saved-filters:
    get:
      tags: [Assets]
      summary: List the current user's personal saved filters
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '200':
          description: Personal filters, including issues for definitions needing repair
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedFilter'
        '401':
          description: Authentication required
    post:
      tags: [Assets]
      summary: Create a personal saved filter
      description: Ownership comes from authentication and the active workspace. Names need not be unique. Maximum request body is 64 KiB.
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilterCreate'
      responses:
        '201':
          description: Saved filter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
        '400':
          description: Invalid name, request or criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterError'
        '401':
          description: Authentication required

  /api/saved-filters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Assets]
      summary: Get a personal saved filter
      description: Another user's filter returns 404, including for administrators. Invalid saved rules are retained and returned with issues.
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '200':
          description: Saved filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
        '400':
          description: Invalid ID
        '401':
          description: Authentication required
        '404':
          description: Filter not found for this user and workspace
    put:
      tags: [Assets]
      summary: Rename or replace a personal saved filter
      description: Name is required. Omit criteria to preserve the definition, including rules needing repair. Supplied criteria must validate. Maximum request body is 64 KiB.
      security:
        - sessionCookie: []
        - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilterUpdate'
      responses:
        '200':
          description: Updated saved filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
        '400':
          description: Invalid name, ID, request or criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterError'
        '401':
          description: Authentication required
        '404':
          description: Filter not found for this user and workspace
    delete:
      tags: [Assets]
      summary: Delete a personal saved filter
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid ID
        '401':
          description: Authentication required
        '404':
          description: Filter not found for this user and workspace

  /api/assets/{id}:
    get:
      tags: [Assets]
      summary: Get asset by ID
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
    put:
      tags: [Assets]
      summary: Update asset
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '200':
          description: Asset updated
    delete:
      tags: [Assets]
      summary: Delete asset
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Asset deleted

  /api/assets/{id}/warranty:
    get:
      tags: [Warranties]
      summary: Get asset warranty
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Warranty details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warranty'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Warranties]
      summary: Create warranty for asset
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarrantyInput'
      responses:
        '201':
          description: Warranty created
    put:
      tags: [Warranties]
      summary: Update asset warranty
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarrantyInput'
      responses:
        '200':
          description: Warranty updated
    delete:
      tags: [Warranties]
      summary: Delete asset warranty
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Warranty deleted

  /api/assets/{id}/events:
    get:
      tags: [Asset Events]
      summary: List custom events for an asset
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Events ordered by occurrence time descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetEvent'
        '400':
          description: Invalid asset ID
        '404':
          description: Asset not found
    post:
      tags: [Asset Events]
      summary: Create a custom asset event
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetEventInput'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEvent'
        '400':
          description: Invalid request
        '404':
          description: Asset not found

  /api/assets/{id}/events/{eventId}:
    put:
      tags: [Asset Events]
      summary: Update a custom asset event
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetEventInput'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEvent'
        '400':
          description: Invalid request
        '404':
          description: Asset or event not found
    delete:
      tags: [Asset Events]
      summary: Delete a custom asset event
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Event deleted
        '400':
          description: Invalid asset or event ID
        '404':
          description: Asset or event not found

  /api/warranties/expiring:
    get:
      tags: [Warranties]
      summary: List expiring warranties
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - name: days
          in: query
          description: Number of days to look ahead
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: List of expiring warranties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Warranty'

  /api/assets/{id}/attachments:
    get:
      tags: [Attachments]
      summary: List asset attachments
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
    post:
      tags: [Attachments]
      summary: Upload attachment
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment uploaded

  /api/attachments/{attachmentId}:
    get:
      tags: [Attachments]
      summary: Get attachment download URL
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presigned download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
    delete:
      tags: [Attachments]
      summary: Delete attachment
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Attachment deleted

  /api/attributes:
    get:
      summary: List reusable organization attributes including select configuration
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeList'
        '400':
          description: Invalid field or option data
        '403':
          description: Administrator access required or plugin-owned field
        '404':
