  /api/me/api-keys:
    get:
      summary: List your active API keys (interactive account only)
      security: &id001
      - sessionCookie: []
      responses:
        '200':
          description: Active, unexpired keys owned by the current user; never includes secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
        '401': &id002
          description: Authentication required
        '403': &id003
          description: Interactive account or admin required
    post:
      summary: Create a scoped API key (interactive account only)
      description: Trimmed description, at least one permission, and future expiry required. The secret is disclosed
        only in this response. Permissions and expiry are immutable.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKey'
      responses:
        '201':
          description: One-time secret
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIKey'
                - type: object
                  required:
                  - secret
                  properties:
                    secret:
                      type: string
                      description: Shown only once; store securely
        '400':
          description: Invalid description, permissions, or expiry
        '401': *id002
        '403': *id003
  /api/me/api-keys/permissions:
    get:
      summary: Permission catalog limited by current role (interactive account only)
      security: *id001
      responses:
        '200':
          description: Permission resources and selectable levels
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    resource:
                      type: string
                      enum:
                      - assets
                      - locations
                      - collections
                      - categories
                      - attributes
                      - tags
                      - conditions
                      - warranties
                      - attachments
                      - asset_events
                      - saved_filters
                      - plugins
                      - users
                      - organization
                    label:
                      type: string
                    levels:
                      type: array
                      items:
                        type: string
                        enum:
                        - none
                        - read
                        - write
        '401': *id002
        '403': *id003
  /api/me/api-keys/{id}:
    parameters:
    - &id004
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      summary: Edit your API key description (interactive account only)
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - description
              properties:
                description:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '204':
          description: Description updated
        '404':
          description: Key not owned by current user
        '401': *id002
        '403': *id003
    delete:
      summary: Revoke your API key (interactive account only)
      security: *id001
      responses:
        '204':
          description: Revoked; subsequent requests fail immediately
        '404':
          description: Key not owned by current user
        '401': *id002
        '403': *id003
  /api/organization/mcp:
    get:
      summary: Read MCP status
      security:
      - sessionCookie: []
      - bearerKey: []
      responses:
        '200':
          description: MCP status (default false)
          content:
            application/json:
              schema: &id005
                type: object
                required:
                - enabled
                additionalProperties: false
                properties:
                  enabled:
                    type: boolean
        '401': *id002
    put:
      summary: Enable or disable MCP (admin only)
      description: Separate from the complete inventory feature map. Disabling blocks the next MCP request without
        disabling REST API keys. Requires organization write scope for API keys.
      security:
      - sessionCookie: []
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: *id005
      responses:
        '200':
          description: Updated MCP status
          content:
            application/json:
              schema: *id005
        '400':
          description: enabled must be a boolean
        '401': *id002
        '403': *id003
  /api/users:
    get:
      summary: List workspace users with aggregate active API key usage (admin only)
      description: Includes api_key_count and api_key_last_used_at for active, unexpired keys. No individual key details are exposed.
      security:
        - sessionCookie: []
        - bearerKey: []
      responses:
        '200':
          description: Workspace users with active-key counts and most recent active-key use
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/User'
                    - type: object
                      properties:
                        api_key_count:
                          type: integer
                          minimum: 0
                        api_key_last_used_at:
                          type: string
                          format: date-time
                          nullable: true
        '403':
          description: Admin access required

  /mcp:
    post:
      summary: Stateless MCP Streamable HTTP endpoint
      description: Official MCP protocol with JSON responses. Requires a scoped bearer API key on every request and
        the workspace MCP setting. Browser cookies and authentication-disabled mode cannot bypass authentication.
        Tools are filtered by scopes, current role, and enabled features. Credential operations are excluded.
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: MCP JSON-RPC initialize, tools/list, or tools/call message
      responses:
        '200':
          description: MCP JSON-RPC response
        '202':
          description: Notification accepted
        '401':
          description: Invalid or missing API key
        '403':
          description: Origin or host protection rejected request
        '404':
          description: MCP disabled
        '413':
          description: Request exceeds 72 MiB

components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: Scoped API key created interactively at /api/me/api-keys. Write includes read. Effective access also follows the current owner role and enabled features.
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Browser session cookie set after a successful local or OIDC login

  parameters:
    ImpactToken:
      name: X-Impact-Token
      in: header
      required: true
      description: Token from the exact impact preview, valid for ten minutes. Re-preview on conflict.
      schema: { type: string }
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  schemas:
    APIKey:
      type: object
      description: Metadata only; secrets and hashes are never included.
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        description:
          type: string
        permissions:
          $ref: '#/components/schemas/APIKeyPermissions'
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    APIKeyPermissions:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        assets:
          type: string
          enum:
          - read
          - write
        locations:
          type: string
          enum:
          - read
          - write
        collections:
          type: string
          enum:
          - read
          - write
        categories:
          type: string
          enum:
          - read
          - write
        attributes:
          type: string
          enum:
          - read
          - write
        tags:
          type: string
          enum:
          - read
          - write
        conditions:
          type: string
          enum:
          - read
          - write
        warranties:
          type: string
          enum:
          - read
          - write
        attachments:
          type: string
          enum:
          - read
          - write
        asset_events:
          type: string
          enum:
          - read
          - write
        saved_filters:
          type: string
          enum:
          - read
          - write
        plugins:
          type: string
          enum:
          - read
          - write
        users:
          type: string
          enum:
          - read
          - write
        organization:
          type: string
          enum:
          - read
          - write
    CreateAPIKey:
      type: object
      additionalProperties: false
      required:
      - description
      - permissions
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        permissions:
          $ref: '#/components/schemas/APIKeyPermissions'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional future expiration; omit or null for no expiry
    FilterCriteria:
      type: object
      additionalProperties: false
      required: [version]
      description: All populated top-level criteria combine with AND. References must belong to the active workspace and be available under its feature settings. Criteria never include pagination.
      properties:
        version:
          type: integer
          enum: [1]
        q:
          type: string
          description: Existing English full-text name/description search; maximum 1000 UTF-8 bytes.
        attribute_q:
          type: string
          description: Literal case-insensitive attribute substring search, including select labels; maximum 1000 UTF-8 bytes.
        category_id:
          type: string
          description: Category UUID including descendants, or uncategorized.
        location_id:
          type: string
          format: uuid
        condition_id:
          type: string
          format: uuid
        collection_id:
          type: string
          format: uuid
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        tag_match:
          type: string
          enum: [any, all]
          default: any
        expression:
          $ref: '#/components/schemas/FilterNode'
    FilterNode:
      description: Recursive expression; at most five group levels and 50 total rules (including populated top-level criteria).
      oneOf:
        - $ref: '#/components/schemas/FilterGroup'
        - $ref: '#/components/schemas/FilterRule'
    FilterGroup:
      type: object
      additionalProperties: false
      required: [kind, match, children]
      properties:
        kind:
          type: string
          enum: [group]
        match:
          type: string
          enum: [all, any]
          description: all is AND; any is OR.
        children:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/FilterNode'
    FilterRule:
      type: object
      additionalProperties: false
      required: [kind, field, operator]
      description: |
        Attribute rules require attribute_id and the current data_type; select rules
        also require selection_mode. References use stable IDs, including option IDs
        in values. Strings/text support eq and contains (case-insensitive); numbers
        and dates support eq/lt/lte/gt/gte/between (inclusive range with upper).
        Dates use YYYY-MM-DD. Booleans use eq with a JSON boolean.
        Selects support any; multiple selections additionally support all.
        All attributes support empty/not_empty without a value: missing, null,
        empty string or empty array count as empty; zero and false do not.
        Collections and tags support any/all; category/location/condition support any.
        Category values may include uncategorized; category matching includes descendants.
        q requires search and attribute_q requires contains, each with a string value.
        Membership rules require values and no value/upper; scalar rules require
        value and no values. Only between accepts upper. Malformed stored values do
        not match typed comparisons. Text operands allow at most 1000 UTF-8 bytes.
        Numeric operands preserve decimal precision and allow at most 1000 bytes
        with an exponent between -1000 and 1000.
      properties:
        kind:
          type: string
          enum: [rule]
        field:
          type: string
          enum: [attribute, collections, tags, category, location, condition, q, attribute_q]
        attribute_id:
          type: string
          format: uuid
        data_type:
          type: string
          enum: [string, text, number, boolean, date, select]
        selection_mode:
          type: string
          enum: [single, multiple]
        operator:
          type: string
          enum: [eq, contains, lt, lte, gt, gte, between, any, all, empty, not_empty, search]
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        values:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        upper:
          oneOf:
            - type: string
              format: date
            - type: number
    AssetSearchRequest:
      type: object
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          $ref: '#/components/schemas/FilterCriteria'
        limit:
          type: integer
          default: 20
          description: Values outside 1 through 100 default to 20.
        offset:
          type: integer
          default: 0
          description: Negative values normalize to zero.
    SavedFilterCreate:
      type: object
      additionalProperties: false
      required: [name, criteria]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before validation; must contain a non-whitespace character.
        criteria:
          $ref: '#/components/schemas/FilterCriteria'
        pinned:
          type: boolean
          default: false
          description: Show this saved search as a desktop sidebar shortcut. Each user may pin at most five searches.
    SavedFilterUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before validation; must contain a non-whitespace character.
        criteria:
          $ref: '#/components/schemas/FilterCriteria'
        pinned:
          type: boolean
          description: Show or hide this saved search as a desktop sidebar shortcut. Each user may pin at most five searches.
    SavedFilter:
      type: object
      required: [id, name, pinned, criteria, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        pinned:
          type: boolean
        criteria:
          $ref: '#/components/schemas/FilterCriteria'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FilterIssue'
    FilterIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          example: expression.children[0]
        message:
          type: string
    FilterError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FilterIssue'
    AttributeOptionInput:
      type: object
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 255 }
        value: { type: string, minLength: 1, maxLength: 255 }
    AttributeOption:
      allOf:
        - $ref: '#/components/schemas/AttributeOptionInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            sort_order: { type: integer }
    AttributeOptions:
      type: array
      items:
        $ref: '#/components/schemas/AttributeOption'
    AttributeOptionUpdate:
      type: object
      required: [id, label, value]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 255 }
        value: { type: string, minLength: 1, maxLength: 255 }
        sort_order: { type: integer }
    AttributeOptionsUpdate:
      type: array
      items:
        $ref: '#/components/schemas/AttributeOptionUpdate'
    AttributeInput:
      type: object
      required: [name, key, data_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        key: { type: string, minLength: 1, maxLength: 100 }
        data_type: { type: string, enum: [string, text, number, boolean, date, select] }
        selection_mode:
          type: string
          enum: [single, multiple]
          description: Only for select fields; defaults to single on creation.
        options:
          type: array
          description: Initial options, only for select fields.
          items:
            $ref: '#/components/schemas/AttributeOptionInput'
    Attribute:
      allOf:
        - $ref: '#/components/schemas/AttributeInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            organization_id: { type: string, format: uuid }
            plugin_id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            options:
              $ref: '#/components/schemas/AttributeOptions'
    AttributeList:
      type: array
      items:
        $ref: '#/components/schemas/Attribute'
    AttributeChanges:
      type: object
      description: Omitted values are preserved. Populated fields cannot change data type or selection mode.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        key: { type: string, minLength: 1, maxLength: 100 }
        data_type: { type: string, enum: [string, text, number, boolean, date, select] }
        selection_mode: { type: string, enum: [single, multiple] }
        options:
          $ref: '#/components/schemas/AttributeOptionsUpdate'
    OptionChanges:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 255 }
        value: { type: string, minLength: 1, maxLength: 255 }
    AttributeOptionOrder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    AttributeImpactRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [update_attribute, delete_attribute, update_option, delete_option]
        option_id: { type: string, format: uuid }
        changes:
          anyOf:
            - $ref: '#/components/schemas/AttributeChanges'
            - $ref: '#/components/schemas/OptionChanges'
    AttributeImpact:
      type: object
      required: [affected_assets, deleted_assets, required_fields_left_empty, current, proposed, confirmation_token]
      properties:
        affected_assets: { type: integer, minimum: 0 }
        deleted_assets: { type: integer, minimum: 0 }
        required_fields_left_empty: { type: integer, minimum: 0 }
        current: { type: string }
        proposed: { type: string }
        confirmation_token: { type: string }
    CategoryAttribute:
      type: object
      properties:
        attribute_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        required: { type: boolean }
        inherited: { type: boolean }
        sort_order: { type: integer }
        attribute:
          $ref: '#/components/schemas/Attribute'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
