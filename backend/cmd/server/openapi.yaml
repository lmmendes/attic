openapi: 3.0.3
info:
  title: Attic Asset Management API
  description: API for managing organizational assets, warranties, and attachments. Protected API routes accept either the web session cookie or an Attic bearer access token.
  version: 1.0.0
  contact:
    name: Attic
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication endpoints
  - name: Categories
    description: Asset category management
  - name: Locations
    description: Location management
  - name: Conditions
    description: Asset condition management
  - name: Assets
    description: Asset management
  - name: Warranties
    description: Warranty management
  - name: Attachments
    description: File attachment management

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

  /auth/methods:
    get:
      tags: [Auth]
      summary: Discover authentication settings for native clients
      responses:
        '200':
          description: Authentication endpoints and registered mobile client

  /oauth/password:
    post:
      tags: [Auth]
      summary: Authenticate the built-in first-party mobile client with a local password
      description: Available only when the server uses local authentication. This is not the OAuth password grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, email, password]
              properties:
                client_id:
                  type: string
                  enum: [attic-mobile]
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Attic access and rotating refresh tokens
        '400':
          description: Invalid request or authentication method
        '401':
          description: Invalid credentials
        '429':
          description: Too many failed sign-in attempts

  /oauth/authorize:
    get:
      tags: [Auth]
      summary: Begin Authorization Code with PKCE
      parameters:
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: client_id
          in: query
          required: true
          schema: { type: string, enum: [attic-mobile] }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to login or to the registered native callback

  /oauth/token:
    post:
      tags: [Auth]
      summary: Exchange an authorization code or rotate a refresh token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                client_id:
                  type: string
                redirect_uri:
                  type: string
                code:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: Attic access and rotating refresh tokens
        '400':
          description: Invalid grant or request

  /oauth/revoke:
    post:
      tags: [Auth]
      summary: Revoke a mobile refresh-token family
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token is revoked or was already inactive

  /api/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories:
    get:
      tags: [Categories]
      summary: List categories
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create category
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /api/categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by ID
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Update category
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags: [Categories]
      summary: Delete category
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Category deleted

  /api/locations:
    get:
      tags: [Locations]
      summary: List locations
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
    post:
      tags: [Locations]
      summary: Create location
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'

  /api/locations/{id}:
    get:
      tags: [Locations]
      summary: Get location by ID
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Location details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
    put:
      tags: [Locations]
      summary: Update location
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '200':
          description: Location updated
    delete:
      tags: [Locations]
      summary: Delete location
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Location deleted

  /api/conditions:
    get:
      tags: [Conditions]
      summary: List conditions
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: List of conditions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Condition'
    post:
      tags: [Conditions]
      summary: Create condition
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionInput'
      responses:
        '201':
          description: Condition created

  /api/conditions/{id}:
    get:
      tags: [Conditions]
      summary: Get condition by ID
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Condition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Condition'
    put:
      tags: [Conditions]
      summary: Update condition
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionInput'
      responses:
        '200':
          description: Condition updated
    delete:
      tags: [Conditions]
      summary: Delete condition
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Condition deleted

  /api/assets:
    get:
      tags: [Assets]
      summary: List assets
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: condition_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
    post:
      tags: [Assets]
      summary: Create asset
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

  /api/assets/{id}:
    get:
      tags: [Assets]
      summary: Get asset by ID
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
    put:
      tags: [Assets]
      summary: Update asset
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '200':
          description: Asset updated
    delete:
      tags: [Assets]
      summary: Delete asset
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Asset deleted

  /api/assets/{id}/warranty:
    get:
      tags: [Warranties]
      summary: Get asset warranty
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Warranty details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warranty'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Warranties]
      summary: Create warranty for asset
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarrantyInput'
      responses:
        '201':
          description: Warranty created
    put:
      tags: [Warranties]
      summary: Update asset warranty
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarrantyInput'
      responses:
        '200':
          description: Warranty updated
    delete:
      tags: [Warranties]
      summary: Delete asset warranty
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Warranty deleted

  /api/warranties/expiring:
    get:
      tags: [Warranties]
      summary: List expiring warranties
      security:
        - sessionCookie: []
      parameters:
        - name: days
          in: query
          description: Number of days to look ahead
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: List of expiring warranties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Warranty'

  /api/assets/{id}/attachments:
    get:
      tags: [Attachments]
      summary: List asset attachments
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
    post:
      tags: [Attachments]
      summary: Upload attachment
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'

  /api/assets/{id}/main-image/{attachmentId}:
    put:
      tags: [Attachments]
      summary: Select an image attachment as the asset main image
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Main image selected

  /api/assets/{id}/main-image:
    delete:
      tags: [Attachments]
      summary: Clear the asset main image
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Main image cleared

  /api/attachments/{attachmentId}:
    get:
      tags: [Attachments]
      summary: Get attachment download URL
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presigned download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
    delete:
      tags: [Attachments]
      summary: Delete attachment
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Attachment deleted

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: OIDC session cookie set after a successful login
    bearerAuth:
      type: http
      scheme: bearer
      description: Short-lived opaque Attic access token issued by /oauth/token

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [user, admin]

    Attribute:
      type: object
      required: [id, name, key, data_type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
        data_type:
          type: string
          enum: [string, number, boolean, text, date]

    CategoryAttribute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        attribute_id:
          type: string
          format: uuid
        required:
          type: boolean
        sort_order:
          type: integer
        attribute:
          $ref: '#/components/schemas/Attribute'

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAttribute'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string
          format: uuid
        icon:
          type: string

    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LocationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string
          format: uuid
        icon:
          type: string

    Condition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConditionInput:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
        description:
          type: string
        sort_order:
          type: integer

    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
          nullable: true
        condition_id:
          type: string
          format: uuid
          nullable: true
        collection_id:
          type: string
          format: uuid
          nullable: true
        main_attachment_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
        quantity:
          type: integer
        attributes:
          type: object
          additionalProperties: true
        purchase_at:
          type: string
          format: date-time
          nullable: true
        purchase_price:
          type: number
          format: double
          nullable: true
        purchase_note:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        main_attachment_url:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/Category'
        location:
          $ref: '#/components/schemas/Location'
        condition:
          $ref: '#/components/schemas/Condition'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssetInput:
      type: object
      required: [name, category_id]
      properties:
        name:
          type: string
        description:
          type: string
        category_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        condition_id:
          type: string
          format: uuid
        collection_id:
          type: string
          format: uuid
        quantity:
          type: integer
          default: 1
        attributes:
          type: object
          additionalProperties: true
        purchase_at:
          type: string
          format: date
        purchase_price:
          type: number
          format: double
        purchase_note:
          type: string
        notes:
          type: string

    AssetList:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Warranty:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        provider:
          type: string
        policy_number:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WarrantyInput:
      type: object
      properties:
        provider:
          type: string
        policy_number:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        notes:
          type: string

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        file_name:
          type: string
        content_type:
          type: string
        file_size:
          type: integer
          format: int64
        file_key:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
          description: Short-lived presigned URL
        created_at:
          type: string
          format: date-time
