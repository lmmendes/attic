name: Feature request
description: Suggest a new capability for Attic
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea for Attic. Focus on the problem first so that different solutions can be considered.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem or unmet need would this feature address? Who experiences it?
      placeholder: I have difficulty doing ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you solve the problem? Describe the workflow or behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other solutions or workarounds have you considered or tried?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, links, or any other context that supports the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission check
      options:
        - label: I searched for an existing request for this feature.
          required: true
